<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The app mark: a pacifier — the teat above, the wide shield across the
       middle, the ring below. The one shape that says "baby" without saying
       "medicine", "calendar" or "chart", and simple enough to survive a
       16px browser tab.

       Flat green on the dark install surface, round caps — the same
       treatment as the sibling contacts and meds apps, so they read as one
       family on a home screen. Flat means flat: one fill, no gradient, no
       bevel, no inner shadow.

       Geometry, in the 100 viewBox: the shield is a horizontal segment from
       (24, 52) to (76, 52) stroked at 22 with round caps; the teat is a disc
       of radius 13 at (50, 27) on a neck from (50, 27) to (50, 46) stroked
       at 12; the ring is an annulus at (50, 74) with outer radius 15 and
       inner radius 9 — the hole shows the tile's own surface through it.
       The same numbers are rasterised into the PNG install icons, the
       favicon and the social card by scripts/generate-icons.mjs
       (`npm run icons`), and mirrored into `AppMarkIcon` in
       src/app/icons.tsx — the three files are kept in step by hand. -->
  <rect width="100" height="100" rx="20" fill="#12101a" />
  <circle cx="50" cy="27" r="13" fill="#3ef07f" />
  <path d="M50 27 L50 46" fill="none" stroke="#3ef07f" stroke-width="12" stroke-linecap="round" />
  <path d="M24 52 L76 52" fill="none" stroke="#3ef07f" stroke-width="22" stroke-linecap="round" />
  <circle cx="50" cy="74" r="12" fill="none" stroke="#3ef07f" stroke-width="6" />
</svg>
